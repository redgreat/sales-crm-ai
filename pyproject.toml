[project]
name = "sales-crm-ai"
version = "0.1.0"
description = "CRM AI 服务：FastAPI + LangGraph + PostgreSQL checkpoint，直连模型 Provider，点对点集成 CRM"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    "pydantic==2.13.4",
    "pydantic-settings>=2.8,<3",
    "langchain-core==1.6.0",
    "langchain-openai==1.6.0",
    "langgraph==1.2.11",
    "langgraph-checkpoint-postgres==3.1.2",
    "psycopg[binary,pool]==3.3.4",
    "httpx>=0.28",
    "mcp==1.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "realpg: 需要真实 PostgreSQL 的测试（conftest 自动起临时实例，缺依赖时显式 skip）",
    "contract: 双端接口契约测试",
    "draftlive: 依赖真实 CRM 环境的建档联调测试",
    "crmlive: 显式授权后运行的真实 CRM 写入联调测试",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.setuptools]
packages = { find = { include = ["app*"] } }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
