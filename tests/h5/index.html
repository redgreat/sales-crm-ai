<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>瑞赢 AI 联调 H5（测试用）</title>
<!--
  生产 H5 形态的测试端（tests/h5/index.html）：企业微信内嵌 H5 的 JWT 链路模拟——
  浏览器不持任何服务密钥，全部调用经 CRM 代理以用户身份执行。

  启动（不要直接双击本文件，file:// 会被 CRM 的 CORS 白名单拦截）：
    .venv/Scripts/python.exe scripts/h5_server.py --port 8320 --open
  打开 http://127.0.0.1:8320/ 后用工号/密码登录（或一键复用本机已保存的 token）。
  登录在服务端完成（OAuth client_secret 不出本机），本页同源调用 /crm/** 由脚本代理转发。
  环境与账号见 docs/测试规范.md。
-->
<style>
  :root { --brand:#2f54eb; --ok:#389e0d; --warn:#d46b08; --err:#cf1322; --line:#e5e7eb; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:#f2f3f5; color:#1f2329; padding-bottom:40px; }
  .wrap { max-width:420px; margin:0 auto; padding:12px; }
  header { position:sticky; top:0; background:var(--brand); color:#fff; padding:10px 12px; font-size:15px; font-weight:600; border-radius:0 0 10px 10px; display:flex; justify-content:space-between; align-items:center; }
  header .status { font-size:11px; font-weight:400; opacity:.9; }
  section { background:#fff; border-radius:10px; margin-top:10px; padding:12px; }
  h2 { font-size:14px; margin-bottom:8px; display:flex; align-items:center; gap:6px; }
  h2 .tag { font-size:10px; color:#8c8c8c; font-weight:400; }
  input, select, textarea, button { font-size:13px; border:1px solid var(--line); border-radius:6px; padding:7px 9px; width:100%; }
  textarea { resize:vertical; min-height:52px; }
  button { background:var(--brand); color:#fff; border:none; cursor:pointer; margin-top:8px; }
  button.ghost { background:#fff; color:var(--brand); border:1px solid var(--brand); }
  button.mini { width:auto; padding:4px 10px; font-size:12px; margin:0; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .row { display:flex; gap:6px; }
  .row > * { flex:1; }
  .meta { font-size:11px; color:#8c8c8c; margin-top:4px; }
  .card { border:1px solid var(--line); border-radius:8px; padding:9px; margin-top:8px; font-size:13px; }
  .card b { font-size:13px; }
  .pill { display:inline-block; padding:1px 7px; border-radius:9px; font-size:11px; margin-left:6px; }
  .pill.ok { background:#f6ffed; color:var(--ok); }
  .pill.warn { background:#fff7e6; color:var(--warn); }
  .pill.err { background:#fff1f0; color:var(--err); }
  .pill.run { background:#e6f4ff; color:#0958d9; }
  .msg { margin-top:6px; padding:7px 9px; border-radius:8px; font-size:13px; max-width:88%; white-space:pre-wrap; word-break:break-all; }
  .msg.user { background:var(--brand); color:#fff; margin-left:auto; }
  .msg.assistant { background:#f2f3f5; }
  .msg .anchor { display:block; font-size:10px; opacity:.65; margin-top:2px; }
  .log { font-size:11px; color:#8c8c8c; margin-top:6px; word-break:break-all; max-height:90px; overflow:auto; }
  .hidden { display:none; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .chip { border:1px solid var(--brand); color:var(--brand); border-radius:14px; padding:4px 10px; font-size:12px; cursor:pointer; background:#fff; }
  .chip.active { background:var(--brand); color:#fff; }
  .pager { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:10px; font-size:12px; color:#595959; }
  .pager button { width:auto; margin:0; padding:5px 10px; }
  #researchResult { white-space:pre-wrap; overflow-wrap:anywhere; max-height:240px; overflow:auto; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span>🤖 瑞赢 AI · 联调 H5</span>
    <span class="status" id="connStatus">未连接</span>
  </header>

  <!-- 登录 -->
  <section id="secLogin">
    <h2>1 · 登录 <span class="tag">工号/密码登录（token 由本地脚本代取，不粘贴）</span></h2>
    <div class="row">
      <input id="username" placeholder="工号（如 ZR20050012）" autocomplete="username">
      <input id="password" type="password" placeholder="密码" autocomplete="current-password">
    </div>
    <label class="meta" style="display:flex;align-items:center;gap:6px;margin-top:6px">
      <input id="keepSignedIn" type="checkbox" checked style="width:auto;margin:0"> 保持登录（token 过期自动续期，密码只存本机内存）
    </label>
    <div class="row">
      <button onclick="login()">登录</button>
      <button class="ghost" onclick="loginReuse()">复用本机 token</button>
      <button class="ghost" onclick="logout()">退出</button>
    </div>
    <div class="meta" id="sessionMeta">未登录</div>
    <div class="log" id="loginLog"></div>
    <div class="meta" style="margin-top:6px">
      <a href="#" onclick="toggleManual(event)" style="color:var(--brand)">手动 token（应急）</a>
    </div>
    <div id="manualBox" class="hidden">
      <textarea id="token" placeholder="仅在无法登录时粘贴 CRM JWT（Bearer eyJ...）"></textarea>
      <button class="mini" onclick="loginManual()">用该 token 登录</button>
    </div>
  </section>

  <!-- 能力目录（M-12：入口契约由注册表渲染） -->
  <section id="secCaps" class="hidden">
    <h2>能力目录 <span class="tag">GET /ai/capabilities（M-12 入口契约）</span></h2>
    <div id="capList" class="meta">未加载</div>
  </section>

  <!-- M19 助手会话 -->
  <section id="secChat">
    <h2>2 · 瑞赢助手 <span class="tag">M19 会话 · 每轮独立 Run · 确认前不落库</span></h2>
    <div class="row">
      <select id="subjectType">
        <option value="">不绑定对象</option>
        <option value="customer">customer</option>
        <option value="lead">lead</option>
        <option value="opportunity">opportunity</option>
      </select>
      <input id="subjectId" placeholder="对象 id（可空）">
    </div>
    <button class="ghost" onclick="newConversation()">新建会话</button>
    <div id="chatBox" style="margin-top:8px"></div>
    <div id="pendingBox"></div>
    <textarea id="chatInput" placeholder="说一句…（如：新增客户：远大物流，客户类型：ORG）"></textarea>
    <div class="row">
      <button onclick="sendMsg()">发送</button>
      <button class="ghost" onclick="refreshMessages()">刷新历史</button>
    </div>
    <div class="meta" id="chatMeta"></div>
  </section>

  <!-- M03/M20 草稿与候选 -->
  <section id="secDraft">
    <h2>3 · 沟通提炼 / 建档草稿 <span class="tag">M03/M20 · 草稿确认后写入</span></h2>
    <div class="chips" id="capChips"></div>
    <textarea id="draftInput" placeholder="沟通内容或建档信息…">客户：恒通物流
任务：电话回访
2026-10-08
负责人：王五</textarea>
    <button id="submitDraft" onclick="createAndImport()">提交 → 等待结果 → 导入候选</button>
    <div id="draftResult"></div>
    <div class="row" style="margin-top:8px">
      <input id="researchCompanyName" placeholder="企业名称">
      <select id="researchProvider" aria-label="查询来源"><option value="bocha">博查</option><option value="qichacha">企查查</option></select>
    </div>
    <button class="ghost" onclick="researchCompany()">查询企业公开信息</button>
    <div id="researchResult" class="meta"></div>
    <div class="log" id="draftLog"></div>
  </section>

  <!-- M07 候选三视图 -->
  <section id="secCands">
    <h2>4 · 我的候选 <span class="tag">M07：当前待确认 / 已确认 / 失败</span></h2>
    <div class="chips" id="viewChips">
      <span class="chip active" data-status="PENDING_CONFIRM" onclick="switchView(this)">待确认</span>
      <span class="chip" data-status="CONFIRMED" onclick="switchView(this)">已确认</span>
      <span class="chip" data-status="" onclick="switchView(this)">全部</span>
      <span class="chip" data-status="WRITE_FAILED" onclick="switchView(this)">写入失败</span>
    </div>
    <div id="candList" class="meta">—</div>
    <div id="candPager" class="pager"></div>
  </section>
</div>

<script>
const $ = (id) => document.getElementById(id);
const LS_USER = 'ry-h5-user';
const chatKey = (username) => `ry-h5-chat:${username}`;
// 全部请求走同源 /crm/**（由 scripts/h5_server.py 代理到 CRM 并注入 token）
let STATE = { base: '/crm', conversationId: null, currentCapability: 'communication.extract', viewStatus: 'PENDING_CONFIRM', candidatePage: 1, candidates: [], importedCandidates: [], customerReturn: null, createdCustomerId: null, pendingRun: null, username: '', password: '', pendingStateVersion: null, sending: false, pendingSend: null };
let RELOGIN_TRIED = false;
const CANDIDATE_PAGE_SIZE = 8;
const runTimeCache = new Map();
let candidateLoadSeq = 0;

function log(id, text) { const el = $(id); el.textContent = (el.textContent ? el.textContent + '\n' : '') + new Date().toLocaleTimeString() + ' ' + text; el.scrollTop = el.scrollHeight; }

function fmtRemaining(sec) {
  if (!sec) return '已过期';
  const m = Math.floor(sec / 60), s = sec % 60;
  return m > 0 ? `${m} 分 ${s} 秒` : `${s} 秒`;
}

function fmtTime(value) {
  if (!value) return '';
  const date = new Date(value);
  return Number.isNaN(date.getTime()) ? '' : date.toLocaleString('zh-CN', { hour12: false });
}

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char]);
}

async function api(method, path, body) {
  const resp = await fetch(STATE.base + path, {
    method, headers: { 'Content-Type': 'application/json' },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  // token 过期且持有密码（保持登录）→ 服务端自动续期后重试一次
  if (resp.status === 401 && !RELOGIN_TRIED && STATE.username && STATE.password) {
    RELOGIN_TRIED = true;
    const ok = await doLogin(STATE.username, STATE.password, true);
    RELOGIN_TRIED = false;
    if (ok) return api(method, path, body);
  }
  let payload = null;
  try { payload = await resp.json(); } catch { payload = { raw: await resp.text() }; }
  return { status: resp.status, ok: resp.ok, body: payload };
}

// ---------- 登录（账号密码 / 复用本机 token / 手动 token 应急）----------

async function doLogin(username, password, silent) {
  const r = await fetch('/__login', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username, password, keep_signed_in: $('keepSignedIn').checked }),
  });
  const body = await r.json().catch(() => ({}));
  if (!r.ok || !body.ok) {
    if (!silent) log('loginLog', '登录失败：' + (body.error || r.status));
    return false;
  }
  STATE.username = body.username || username || STATE.username;
  if (password && $('keepSignedIn').checked) STATE.password = password;
  onConnected(body, STATE.username);
  if (!silent) log('loginLog', `登录成功 ${STATE.username} · token 剩余 ${fmtRemaining(body.remaining_seconds)}`);
  return true;
}

function onConnected(view, username) {
  const who = view.username || username || '';
  STATE.username = who;
  $('connStatus').textContent = '已登录 ' + who;
  $('connStatus').style.opacity = 1;
  $('sessionMeta').textContent = `已登录 ${who} · token 剩余 ${fmtRemaining(view.remaining_seconds)}（来源 ${view.source || 'login'}）`;
  $('secCaps').classList.remove('hidden');
  loadCapabilities();
  switchView($('viewChips').querySelector('.active'));
  const saved = JSON.parse(sessionStorage.getItem(chatKey(who)) || 'null');
  if (saved && saved.conversationId) {
    STATE.conversationId = saved.conversationId;
    STATE.pendingSend = saved.pendingSend || null;
    $('chatInput').value = STATE.pendingSend?.text || '';
    $('chatMeta').textContent = '会话 ' + STATE.conversationId.slice(0, 8) + '…';
    refreshMessages();
    checkPending();
    if (saved.runId) pollRun(saved.runId, () => { refreshMessages(); checkPending(); saveChat(); });
  }
}

function saveChat(runId = null) {
  if (!STATE.username || !STATE.conversationId) return;
  sessionStorage.setItem(chatKey(STATE.username), JSON.stringify({
    conversationId: STATE.conversationId, pendingSend: STATE.pendingSend, runId,
  }));
}

async function login() {
  const u = $('username').value.trim(), p = $('password').value;
  if (!u || !p) { log('loginLog', '请填写工号与密码'); return; }
  localStorage.setItem(LS_USER, u);
  await doLogin(u, p, false);
}

async function loginReuse() {
  const r = await fetch('/__login', {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({}),
  }).then((x) => x.json()).catch(() => ({}));
  if (r.ok) {
    STATE.username = r.username || STATE.username;
    onConnected(r, STATE.username);
    log('loginLog', `复用本机 token ${STATE.username} · 剩余 ${fmtRemaining(r.remaining_seconds)}`);
  } else {
    log('loginLog', '本机 token 缺失或已过期：' + (r.error || '') + '（请用工号密码登录）');
  }
}

async function loginManual() {
  const t = ($('token').value || '').trim();
  if (!t) { log('loginLog', '请粘贴 token'); return; }
  const r = await fetch('/__login', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ token: t, username: $('username').value.trim() }),
  }).then((x) => x.json()).catch(() => ({}));
  if (r.ok) { onConnected(r, r.username); log('loginLog', '手动 token 已生效'); }
  else log('loginLog', '手动 token 失败：' + (r.error || ''));
}

async function logout() {
  await fetch('/__logout', { method: 'POST' });
  if (STATE.username) sessionStorage.removeItem(chatKey(STATE.username));
  STATE.password = ''; STATE.lastCandidate = null; STATE.conversationId = null; STATE.pendingSend = null;
  $('connStatus').textContent = '未登录';
  $('sessionMeta').textContent = '已退出';
  log('loginLog', '已退出登录');
}

function toggleManual(e) {
  e.preventDefault();
  $('manualBox').classList.toggle('hidden');
}

function pill(text, kind) { return `<span class="pill ${kind}">${text}</span>`; }

function statusPill(status, writeStatus) {
  const cls = (s) => s === 'WRITTEN' || s === 'succeeded' || s === '已写入' ? 'ok'
    : s === 'FAILED' || s === 'failed' ? 'err'
    : (s === 'PENDING_CONFIRM' || s === 'queued' || s === 'waiting_input' || s === 'running') ? 'run' : 'warn';
  let html = status ? pill(status, cls(status)) : '';
  if (writeStatus) html += ' ' + pill('写入:' + writeStatus, cls(writeStatus));
  return html;
}

async function loadCapabilities() {
  const r = await api('GET', '/ai/capabilities');
  const list = (r.body && (r.body.capabilities || r.body.CAPABILITIES)) || [];
  if (!Array.isArray(list)) { $('capList').textContent = JSON.stringify(r.body).slice(0, 200); return; }
  $('capList').innerHTML = list.map(c => {
    const ro = c.read_only === false ? pill('产草稿', 'warn') : pill('只读', 'ok');
    return `<div class="card"><b>${c.capability || c.name}</b> ${ro}
      <div class="meta">${(c.description || '').slice(0, 70)}</div></div>`;
  }).join('');
  // 草稿入口 chips
  const names = list.map(c => c.capability || c.name);
  const want = ['communication.extract', 'customer.draft', 'contact.draft', 'lead.draft', 'opportunity.draft'];
  $('capChips').innerHTML = want.filter(n => names.includes(n))
    .map(n => `<span class="chip ${n === STATE.currentCapability ? 'active' : ''}" data-cap="${n}" onclick="pickCap(this)">${n}</span>`).join('');
}

function pickCap(el) {
  STATE.currentCapability = el.dataset.cap;
  document.querySelectorAll('#capChips .chip').forEach(c => c.classList.toggle('active', c === el));
}

async function researchCompany() {
  const name = $('researchCompanyName').value.trim();
  const target = $('researchResult');
  if (name.length < 2) { target.textContent = '请输入完整企业名称'; return; }
  target.textContent = '查询中…';
  try {
    const r = await api('POST', '/ai/research/company', { company_name: name, provider: $('researchProvider').value });
    if (!r.ok) { target.textContent = r.body?.error?.message || r.body?.errorMessage || r.body?.message || '查询不可用，请检查 MCP 配置'; return; }
    target.textContent = `${r.body?.text || '未找到公开资料'}\n未核实，不会自动写入 CRM。`;
    for (const url of r.body?.sources || []) {
      if (!/^https?:\/\//.test(url)) continue;
      const link = document.createElement('a');
      link.href = url; link.target = '_blank'; link.rel = 'noopener noreferrer';
      link.textContent = url;
      link.style.display = 'block';
      target.appendChild(link);
    }
  } catch { target.textContent = '查询服务暂不可达'; }
}

// ---------- M19 助手 ----------

async function newConversation() {
  const r = await api('POST', '/ai/conversations', {
    subject_type: $('subjectType').value || null,
    subject_id: $('subjectId').value || null,
  });
  if (!r.ok) { log('chatMeta', '建会话失败 ' + JSON.stringify(r.body).slice(0, 120)); return; }
  STATE.conversationId = r.body.conversation_id;
  STATE.pendingSend = null;
  saveChat();
  $('chatBox').innerHTML = '';
  $('chatMeta').textContent = '会话 ' + STATE.conversationId.slice(0, 8) + '…（对象绑定 ' + (r.body.subject_type || '无') + '）';
}

async function sendMsg() {
  if (STATE.sending) return;
  if (!STATE.conversationId) { await newConversation(); if (!STATE.conversationId) return; }
  const text = $('chatInput').value.trim();
  if (!text) return;
  STATE.sending = true;
  const pending = STATE.pendingSend;
  if (!pending || pending.text !== text || pending.conversationId !== STATE.conversationId) {
    STATE.pendingSend = { text, conversationId: STATE.conversationId, key: crypto.randomUUID(), stateVersion: STATE.pendingStateVersion };
  }
  saveChat();
  // 等待态补参时携带 state_version（P3 多入口版本守卫：防旧页面/并发会话恢复新等待）
  const body = { text, idempotency_key: STATE.pendingSend.key };
  if (STATE.pendingSend.stateVersion !== null) body.state_version = STATE.pendingSend.stateVersion;
  try {
    const r = await api('POST', `/ai/conversations/${STATE.conversationId}/messages`, body);
    if (!r.ok) { $('chatMeta').textContent = '发送失败 ' + r.status + '；可重试'; return; }
    STATE.pendingSend = null;
    STATE.pendingStateVersion = null;
    $('chatInput').value = '';
    saveChat(r.body.run_id || null);
    refreshMessages();
    $('chatMeta').textContent = `mode=${r.body.mode} run=${(r.body.run_id || '').slice(0, 8)}…`;
    if (r.body.run_id) pollRun(r.body.run_id, () => { refreshMessages(); checkPending(); saveChat(); });
  } catch (e) {
    $('chatMeta').textContent = '网络中断；原消息和请求键已保留，可重试';
  } finally { STATE.sending = false; }
}

function appendMsg(role, text, anchor) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  if (anchor) { const a = document.createElement('span'); a.className = 'anchor'; a.textContent = anchor; div.appendChild(a); }
  $('chatBox').appendChild(div);
  $('chatBox').scrollTop = $('chatBox').scrollHeight;
}

async function refreshMessages() {
  if (!STATE.conversationId) return;
  const r = await api('GET', `/ai/conversations/${STATE.conversationId}/messages`);
  if (!Array.isArray(r.body)) {
    if (r.status === 403 || r.status === 404) {
      sessionStorage.removeItem(chatKey(STATE.username));
      STATE.conversationId = null; STATE.pendingSend = null;
      $('chatMeta').textContent = '会话不可访问，请新建会话';
    }
    return;
  }
  $('chatBox').innerHTML = '';
  for (const m of r.body) appendMsg(m.role, m.content);
}

async function checkPending() {
  if (!STATE.conversationId) return;
  const r = await api('GET', `/ai/conversations/${STATE.conversationId}/pending`);
  if (r.body && r.body.waiting) {
    const qs = (r.body.questions || []).map(q => q.label || q.field || q.task_title).join('、');
    STATE.pendingStateVersion = r.body.state_version ?? null;
    $('pendingBox').innerHTML = `<div class="card">⏳ 助手追问：${qs} <span class="meta">state_version=${r.body.state_version}（直接发消息即补参，会带上该版本）</span></div>`;
  } else {
    STATE.pendingStateVersion = null;
    $('pendingBox').innerHTML = '';
  }
}

function pollRun(runId, onSettled, intervalMs = 3000, maxWaitMs = 120000) {
  const deadline = Date.now() + maxWaitMs;
  const timer = setInterval(async () => {
    const r = await api('GET', `/ai/runs/${runId}`);
    const s = r.body && r.body.status;
    if (['succeeded', 'failed', 'cancelled', 'waiting_input'].includes(s) || Date.now() > deadline) {
      clearInterval(timer);
      if (onSettled) onSettled(r.body);
    }
  }, intervalMs);
}

// ---------- M03/M20 草稿 ----------

async function createAndImport() {
  const submit = $('submitDraft');
  if (submit.disabled) return;
  const text = $('draftInput').value.trim();
  if (!text) return;
  const capability = STATE.currentCapability;
  submit.disabled = true;
  const box = $('draftResult');
  box.innerHTML = '<div class="meta">提交中…</div>';
  $('draftLog').textContent = '';
  const r = await api('POST', '/ai/runs', {
    capability, text, client_request_key: crypto.randomUUID()
  });
  if (!r.ok) { box.innerHTML = `<div class="card">❌ 创建失败 ${JSON.stringify(r.body).slice(0, 160)}</div>`; submit.disabled = false; return; }
  const runId = r.body.run_id;
  box.innerHTML = `<div class="card">Run ${runId.slice(0, 8)}… ${pill(r.body.status, 'run')} <span class="meta">等待 AI 执行（真实模型约 20-25s）</span></div>`;
  pollRun(runId, run => handleDraftRun(run, capability));
}

async function handleDraftRun(run, capability) {
  const box = $('draftResult');
  const submit = $('submitDraft');
  if (!run || run.status === 'waiting_input') {
    await showDraftPending(run?.run_id, capability);
    return;
  }
  submit.disabled = false;
  if (run.status !== 'succeeded') {
    box.innerHTML = `<div class="card">Run ${pill(run.status, run.status === 'failed' ? 'err' : 'warn')} ${run.error ? JSON.stringify(run.error).slice(0, 140) : ''}</div>`;
    return;
  }
  const runId = run.run_id;
  runTimeCache.set(runId, run.created_at || null);
  const isDraft = capability.endsWith('.draft');
  const imp = await api('POST', `/ai/runs/${runId}/${isDraft ? 'import-draft' : 'import'}`);
  if (!imp.ok) { box.innerHTML = `<div class="card">导入失败 ${imp.status} ${JSON.stringify(imp.body).slice(0, 140)}</div>`; log('draftLog', imp.status + ' ' + JSON.stringify(imp.body)); return; }
  const imported = isDraft ? [imp.body] : imp.body.items;
  if (!Array.isArray(imported)) {
    box.textContent = '导入返回缺少候选列表';
    log('draftLog', JSON.stringify(imp.body).slice(0, 220));
    return;
  }
  STATE.importedCandidates = imported;
  renderImportedCandidates();
  switchView($('viewChips').querySelector('.active'));
}

async function showDraftPending(runId, capability) {
  if (!runId) { $('draftResult').textContent = 'Run 等待补充信息，请刷新后重试'; $('submitDraft').disabled = false; return; }
  const r = await api('GET', `/ai/runs/${runId}/pending`);
  if (!r.ok || !r.body.waiting || r.body.state_version == null) {
    $('draftResult').textContent = '无法读取待补信息，请稍后重试';
    $('submitDraft').disabled = false;
    return;
  }
  STATE.pendingRun = { runId, capability, stateVersion: r.body.state_version, questions: r.body.questions || [] };
  const optionSources = {
    customer_type: ['/customers/types', null],
    region: ['/dictionaries/children?parentCode=REGION', null],
    biz_line: ['/dictionaries/children?parentCode=BIZ_LINE', null],
  };
  const options = {};
  await Promise.all(STATE.pendingRun.questions.filter(q => optionSources[q.field]).map(async q => {
    const [path, key] = optionSources[q.field];
    try {
      const response = await api('GET', path);
      const items = key ? response.body?.[key] : response.body;
      options[q.field] = response.ok && Array.isArray(items) ? items.filter(item => item.value && item.label) : [];
    } catch { options[q.field] = []; }
  }));
  Object.values(options).forEach(items => {
    const counts = items.reduce((acc, item) => (acc[item.label] = (acc[item.label] || 0) + 1, acc), {});
    items.forEach(item => { item.displayLabel = counts[item.label] > 1 ? `${item.label} (${item.value})` : item.label; });
  });
  $('draftResult').innerHTML = `<div class="card"><b>请补充以下信息</b>
    ${STATE.pendingRun.questions.map((q, i) => `<label class="meta" style="display:block;margin-top:8px">${escapeHtml(q.label || q.field)}
      ${optionSources[q.field] ? `<select id="pendingField${i}" data-field="${escapeHtml(q.field)}" ${options[q.field]?.length ? '' : 'disabled'}><option value="">${options[q.field]?.length ? '请选择' : 'CRM 选项加载失败，请刷新重试'}</option>${(options[q.field] || []).map(item => `<option value="${escapeHtml(item.value)}">${escapeHtml(item.displayLabel)}</option>`).join('')}</select>` : `<input id="pendingField${i}" data-field="${escapeHtml(q.field)}" placeholder="${escapeHtml(q.label || q.field)}">`}</label>`).join('')}
    <button onclick="resumePendingRun()">提交补充信息</button></div>`;
}

async function resumePendingRun() {
  const pending = STATE.pendingRun;
  if (!pending) return;
  const fields = {};
  pending.questions.forEach((q, i) => {
    const value = ($(`pendingField${i}`)?.value || '').trim();
    if (value) fields[q.field] = value;
  });
  if (!Object.keys(fields).length) return;
  const values = pending.capability.endsWith('.draft') ? { fields } : fields;
  const r = await api('POST', `/ai/runs/${pending.runId}/resume`, { state_version: pending.stateVersion, values });
  if (!r.ok) { log('draftLog', '补充失败 ' + r.status + ' ' + JSON.stringify(r.body).slice(0, 160)); return; }
  STATE.pendingRun = null;
  $('draftResult').textContent = '补充信息已提交，等待 AI 继续处理…';
  pollRun(pending.runId, run => handleDraftRun(run, pending.capability));
}

function renderImportedCandidates() {
  const cards = STATE.importedCandidates.length
    ? STATE.importedCandidates.map(renderCandidateCard).join('')
    : '<div class="meta">本次 Run 没有生成候选</div>';
  const continuation = STATE.customerReturn && STATE.createdCustomerId
    ? `<div class="card">客户已创建（${escapeHtml(STATE.createdCustomerId)}），原候选尚未写入。
      <button onclick="confirmOriginalWithNewCustomer()">使用新客户确认原候选</button></div>` : '';
  $('draftResult').innerHTML = cards + continuation;
}

function renderCandidateCard(c) {
  const isDraft = ['CUSTOMER', 'CONTACT', 'LEAD', 'OPPORTUNITY'].includes(c.candidate_type);
  const unmatched = !isDraft && c.match_status !== 'MATCHED';
  const fields = (() => { try { return JSON.parse(c.draft_payload || '{}').fields || {}; } catch { return {}; } })();
  return `
    <div class="card">
      <b>${c.title || c.candidate_type}</b> ${pill(c.candidate_type, 'run')} ${statusPill(c.status, c.write_status)}
      <div class="meta">候选 ${c.id} · 匹配 ${c.match_status}${c.customer_id ? ' · 客户 ' + c.customer_id : ''}</div>
      ${c.customer_name_hint ? `<div class="meta">AI 识别客户：${escapeHtml(c.customer_name_hint)}</div>` : ''}
      ${unmatched ? `<div class="meta" style="color:var(--warn)">当前权限范围内未匹配到该客户，请先核对名称或新建客户；不会自动创建。</div>
        <button class="mini ghost" onclick="startCustomerDraft('${c.id}')">新建客户草稿</button>` : ''}
      <div class="meta">${c.created_at ? '候选创建' : 'Run 创建'}：${fmtTime(c.created_at || runTimeCache.get(c.run_id)) || '时间不可用'}${c.due_at ? ' · 截止：' + fmtTime(c.due_at) : ''}${c.occurred_at ? ' · 发生：' + fmtTime(c.occurred_at) : ''}</div>
      ${Object.keys(fields).length ? `<div class="meta">草稿字段：${Object.entries(fields).map(([k, v]) => k + '=' + v).join('  ')}</div>` : ''}
      ${c.match_hint ? `<div class="meta" style="color:var(--warn)">⚠ ${c.match_hint}</div>` : ''}
      ${c.write_error ? `<div class="meta" style="color:var(--err)">✗ ${c.write_error}</div>` : ''}
      ${c.formal_id ? `<div class="meta" style="color:var(--ok)">✔ 正式对象 ${c.formal_id}</div>` : ''}
      <div class="row" style="margin-top:8px">
        <input id="ovr_${c.id}" placeholder='${unmatched ? '已有客户 ID：{"customer_id":"CU..."}' : '确认覆盖项 JSON（可空）'}'>
        <button class="mini" onclick="confirmCand('${c.id}')">${isDraft ? '确认写入' : '确认'}</button>
        <button class="mini ghost" onclick="ignoreCand('${c.id}')">忽略</button>
      </div>
    </div>`;
}

async function confirmCand(id) {
  const c = STATE.importedCandidates.find(item => item.id === id);
  if (!c) { log('draftLog', '候选已变化，请重新导入'); return; }
  const isDraft = ['CUSTOMER', 'CONTACT', 'LEAD', 'OPPORTUNITY'].includes(c.candidate_type);
  let overrides = {};
  const raw = ($('ovr_' + id) || {}).value;
  if (raw && raw.trim()) { try { overrides = JSON.parse(raw); } catch { alert('覆盖项不是合法 JSON'); return; } }
  if (!isDraft && c.match_status !== 'MATCHED' && !overrides.customer_id) {
    log('draftLog', `已识别客户“${c.customer_name_hint || '未知'}”，但 CRM 未匹配。请先新建客户，或填入已有客户 ID 后确认。`);
    return;
  }
  // 活动/任务候选按 Run 维度批量确认（CRM 端点 /ai/runs/{runId}/confirm）；建档候选按候选 id 单个确认
  const runId = c.run_id || c.runId || id;
  const target = isDraft ? `/ai/candidates/${id}/confirm-draft` : `/ai/runs/${runId}/confirm`;
  const itemId = c.item_id;
  if (!isDraft && !itemId) { log('draftLog', '候选缺少 item_id，无法逐项确认'); return; }
  const r = await api('POST', target, isDraft ? overrides : { item_ids: [itemId], items: [Object.assign({ item_id: itemId }, overrides)] });
  if (!r.ok) { log('draftLog', '确认失败 ' + r.status + ' ' + JSON.stringify(r.body).slice(0, 160)); return; }
  const results = r.body.results || [r.body];
  const confirmed = results.find(item => item.id === id || item.item_id === itemId) || results[0] || {};
  log('draftLog', '确认返回：' + JSON.stringify(confirmed).slice(0, 220));
  STATE.importedCandidates = STATE.importedCandidates.map(item => item.id === id ? Object.assign({}, item, confirmed) : item);
  if (isDraft && c.candidate_type === 'CUSTOMER' && confirmed.write_status === 'WRITTEN' && STATE.customerReturn) {
    const payload = (() => { try { return JSON.parse(confirmed.draft_payload || '{}'); } catch { return {}; } })();
    STATE.createdCustomerId = confirmed.formal_id || confirmed.customer_id || payload.formal_id || null;
  }
  renderImportedCandidates();
  switchView($('viewChips').querySelector('.active'));
}

function startCustomerDraft(id) {
  const c = STATE.importedCandidates.find(item => item.id === id) || STATE.candidates.find(item => item.id === id);
  if (!c || !c.customer_name_hint) { log('draftLog', '候选没有可用客户名称，请手工填写客户草稿'); return; }
  STATE.customerReturn = { runId: c.run_id, itemId: c.item_id, candidateId: c.id };
  STATE.createdCustomerId = null;
  STATE.currentCapability = 'customer.draft';
  document.querySelectorAll('#capChips .chip').forEach(chip => chip.classList.toggle('active', chip.dataset.cap === 'customer.draft'));
  $('draftInput').value = `客户名称：${c.customer_name_hint}`;
  $('draftResult').textContent = `已准备“${c.customer_name_hint}”的客户草稿。提交后 AI 会追问客户类型、经营区域和业务线；本人确认前不会创建客户。`;
  $('secDraft').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

async function confirmOriginalWithNewCustomer() {
  const original = STATE.customerReturn;
  const customerId = STATE.createdCustomerId;
  if (!original || !customerId) return;
  const r = await api('POST', `/ai/runs/${original.runId}/confirm`, {
    item_ids: [original.itemId], items: [{ item_id: original.itemId, customer_id: customerId }]
  });
  if (!r.ok) { log('draftLog', '原候选确认失败 ' + r.status + ' ' + JSON.stringify(r.body).slice(0, 160)); return; }
  const result = (r.body.results || []).find(item => item.id === original.candidateId || item.item_id === original.itemId);
  log('draftLog', '原候选确认：' + JSON.stringify(result || r.body).slice(0, 220));
  if (result?.write_status === 'WRITTEN') { STATE.customerReturn = null; STATE.createdCustomerId = null; renderImportedCandidates(); }
  loadCandidates();
}

async function ignoreCand(id) {
  const r = await api('POST', `/ai/candidates/${id}/ignore`);
  log('draftLog', '忽略 ' + r.status + ' ' + JSON.stringify(r.body).slice(0, 120));
  switchView($('viewChips').querySelector('.active'));
}

// ---------- 候选三视图 ----------

function switchView(el) {
  document.querySelectorAll('#viewChips .chip').forEach(c => c.classList.toggle('active', c === el));
  STATE.viewStatus = el.dataset.status || '';
  STATE.candidatePage = 1;
  loadCandidates();
}

async function loadCandidates() {
  const seq = ++candidateLoadSeq;
  const r = await api('GET', '/ai/candidates');
  if (seq !== candidateLoadSeq) return;
  if (!Array.isArray(r.body)) {
    $('candList').textContent = JSON.stringify(r.body).slice(0, 140);
    $('candPager').textContent = '';
    return;
  }
  STATE.candidates = r.body
    .filter(c => STATE.viewStatus === 'WRITE_FAILED' ? c.write_status === 'FAILED'
      : !STATE.viewStatus || c.status === STATE.viewStatus)
    .sort((a, b) => (Number(b.id?.replace(/\D/g, '')) || 0) - (Number(a.id?.replace(/\D/g, '')) || 0));
  renderCandidatePage(seq);
}

function changeCandidatePage(delta) {
  STATE.candidatePage += delta;
  renderCandidatePage(candidateLoadSeq);
}

function renderCandidatePage(seq) {
  const total = STATE.candidates.length;
  const pages = Math.max(1, Math.ceil(total / CANDIDATE_PAGE_SIZE));
  STATE.candidatePage = Math.min(Math.max(1, STATE.candidatePage), pages);
  if (!total) {
    $('candList').textContent = '（空）';
    $('candPager').textContent = '';
    return;
  }
  const start = (STATE.candidatePage - 1) * CANDIDATE_PAGE_SIZE;
  const visible = STATE.candidates.slice(start, start + CANDIDATE_PAGE_SIZE);
  $('candList').innerHTML = visible.map(c => `
    <div class="card">
      <b>${c.title || c.candidate_type}</b> ${pill(c.candidate_type, 'run')} ${statusPill(c.status, c.write_status)}
      <div class="meta">${c.id} · 匹配 ${c.match_status}${c.write_error ? ' · ' + c.write_error : ''}
      ${c.formal_activity_id || c.formal_task_id ? ' · 正式 ' + (c.formal_activity_id || c.formal_task_id) : ''}</div>
      ${c.customer_name_hint ? `<div class="meta">AI 识别客户：${escapeHtml(c.customer_name_hint)}</div>` : ''}
      <div class="meta">${c.created_at ? '候选创建' : 'Run 创建'}：${fmtTime(c.created_at || runTimeCache.get(c.run_id)) || (runTimeCache.has(c.run_id) ? '时间不可用' : '读取中')}</div>
      ${c.due_at || c.occurred_at ? `<div class="meta">${c.due_at ? '截止：' + fmtTime(c.due_at) : '发生：' + fmtTime(c.occurred_at)}</div>` : ''}
      ${['ACTIVITY', 'TASK'].includes(c.candidate_type) && c.match_status !== 'MATCHED' ? `<div class="meta" style="color:var(--warn)">当前权限范围未匹配，请核对名称或新建客户。</div><button class="mini ghost" onclick="startCustomerDraft('${c.id}')">新建客户草稿</button>` : ''}
      ${c.status === 'PENDING_CONFIRM' ? `<button class="mini" onclick="confirmFromList('${c.id}', '${c.run_id || ''}', '${c.item_id || ''}', ${c.candidate_type === 'CUSTOMER' || c.candidate_type === 'CONTACT' || c.candidate_type === 'LEAD' || c.candidate_type === 'OPPORTUNITY'})">确认</button>
      <button class="mini ghost" onclick="ignoreCand('${c.id}')">忽略</button>` : ''}
    </div>`).join('');
  $('candPager').innerHTML = `<button class="ghost" onclick="changeCandidatePage(-1)" ${STATE.candidatePage === 1 ? 'disabled' : ''}>上一页</button>
    <span>${STATE.candidatePage} / ${pages} · 共 ${total} 条</span>
    <button class="ghost" onclick="changeCandidatePage(1)" ${STATE.candidatePage === pages ? 'disabled' : ''}>下一页</button>`;
  const missingRuns = [...new Set(visible.filter(c => !c.created_at && c.run_id && !runTimeCache.has(c.run_id)).map(c => c.run_id))];
  if (missingRuns.length) {
    Promise.all(missingRuns.map(async runId => {
      try {
        const r = await api('GET', `/ai/runs/${runId}`);
        runTimeCache.set(runId, r.ok ? r.body.created_at || null : null);
      } catch { runTimeCache.set(runId, null); }
    })).then(() => { if (seq === candidateLoadSeq) renderCandidatePage(seq); });
  }
}

async function confirmFromList(id, runId, itemId, isDraft) {
  const candidate = STATE.candidates.find(item => item.id === id);
  if (!isDraft && candidate?.match_status !== 'MATCHED') {
    log('draftLog', `已识别客户“${candidate?.customer_name_hint || '未知'}”，但 CRM 未匹配。请先新建客户草稿。`);
    $('secDraft').scrollIntoView({ behavior: 'smooth', block: 'start' });
    return;
  }
  const target = isDraft
    ? `/ai/candidates/${id}/confirm-draft`
    : `/ai/runs/${runId}/confirm`;
  if (!isDraft && !itemId) { log('draftLog', '候选缺少 item_id，无法逐项确认'); return; }
  const body = isDraft ? {} : { item_ids: [itemId], items: [{ item_id: itemId }] };
  const r = await api('POST', target, body);
  log('draftLog', '确认 ' + r.status + ' ' + JSON.stringify(r.body).slice(0, 180));
  loadCandidates();
}

// 页面载入：只复用服务端会话；密码不写 localStorage，也不做磁盘恢复。
window.addEventListener('load', async () => {
  if (location.protocol === 'file:') {
    log('loginLog', '⚠ 请用 .venv/Scripts/python.exe scripts/h5_server.py --open 启动后访问 http://127.0.0.1:8320/；file:// 无法登录且会被 CRM CORS 拦截');
    return;
  }
  const u = localStorage.getItem(LS_USER) || 'ZR20050012';
  $('username').value = u;
  const r = await fetch('/__session').then((x) => x.json()).catch(() => ({}));
  if (r.connected) {
    STATE.username = r.username || STATE.username;
    onConnected(r, STATE.username);
    log('loginLog', `自动复用会话 ${STATE.username} · 剩余 ${fmtRemaining(r.remaining_seconds)}`);
  } else {
    log('loginLog', '未登录：填工号密码点「登录」，或点「复用本机 token」');
  }
});
