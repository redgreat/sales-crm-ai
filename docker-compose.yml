# sales-crm-ai 部署编排。
# 镜像来自 Quay（推送 v* 标签由 CI 自动构建；标签：latest / sha-<短提交> / vX.Y.Z）：
#   https://quay.io/zrcrm/sales-crm-ai
# 源码：https://github.com/redgreat/sales-crm-ai.git
#
# 快速部署：
#   1. 准备配置：cp conf/config.yml.example conf/config.yml，填好 database_url 与模型凭据
#      （密钥推荐用环境变量注入，优先级高于 config.yml，见下方 environment 注释）。
#   2. 初始化库结构（显式执行，启动只校验不改库）：
#        docker compose run --rm sales-crm-ai python scripts/init_db.py --apply
#        docker compose run --rm sales-crm-ai python scripts/init_checkpoints.py --apply
#   3. 启动：docker compose up -d
#
# 对外入口（都走同一个 8310 端口，由反代按路径分流，无需额外端口）：
#   /admin        配置后台 SPA（开关 admin.enabled / admin.allow_prod）
#   /h5           H5 测试联调页（仅 dev/test 且 api.playground.enabled；prod 一律 404）
#   /playground   开发联调 API 代理（同 /h5 开关）
#   /api/v1       业务 API（服务间 HMAC 签名）
#   /health /ready 健康与就绪探针
#   4. 验证：curl -f http://127.0.0.1:8310/ready （schema/checkpoint/model 三项须 ok）
#      后台页面：http://127.0.0.1:8310/admin （已打包进镜像，无需额外部署前端）
#
# 更新重新部署（服务器上执行，详见脚本头注释）：
#   ./scripts/redeploy.sh                 # 拉最新镜像并重启（默认不动数据库）
#   ./scripts/redeploy.sh --tag v1.2.3    # 部署指定版本
#   ./scripts/redeploy.sh --migrate       # 重启前应用数据库迁移
#
# 单容器同时运行 API 与 worker（uvicorn lifespan 受管，worker.enabled 控制）。
# 数据库用外部 PostgreSQL（生产建议托管实例，如阿里云 RDS——库部署/备份由云托管负责）；
# 如需临时本地库，用 `docker compose --profile local-db up -d` 额外拉起 postgres，
# 并把 database_url 指向 postgres:5432。
#
# 资源与日志：默认 2 核 / 2G（reservation 512m），可用环境变量按服务器规格覆盖：
#   SAI_CPUS=4.0 SAI_MEM_LIMIT=4G SAI_MEM_RESERVATION=1G docker compose up -d
# 日志走容器 json-file 轮转（10m × 3），不落盘到宿主目录；
# 健康状态由镜像内 HEALTHCHECK 提供，编排里不再重复定义。

services:
  sales-crm-ai:
    # 标签可用 SAI_IMAGE_TAG 覆盖（默认 latest）：scripts/redeploy.sh --tag v1.2.3
    image: quay.io/zrcrm/sales-crm-ai:${SAI_IMAGE_TAG:-latest}
    container_name: sales-crm-ai
    hostname: sales-crm-ai
    restart: unless-stopped
    ports:
      - "8310:8310"
    environment:
      TZ: Asia/Shanghai
      # 密钥类配置优先级高于 config.yml，推荐部署时用环境变量注入（密钥不落盘）：
      #   SAI_MODEL_API_KEY          模型供应商 Key
      #   SAI_CRM_SECRET             AI→CRM 服务签名密钥（与 CRM 端 AI_SERVICE_AUTH_SECRET 同值）
      #   SAI_ASR_API_KEY            百炼录音识别
      #   SAI_OCR_ACCESS_KEY_ID / SAI_OCR_ACCESS_KEY_SECRET      阿里云 OCR
      #   SAI_OSS_ACCESS_KEY_ID / SAI_OSS_ACCESS_KEY_SECRET / SAI_OSS_ENDPOINT / SAI_OSS_BUCKET
      # 配置后台（已打包进镜像，访问 http://<host>:8310/admin）：
      #   SAI_ADMIN_ENABLED=false        关闭后台（页面与后台 API 一律 404）
      #   SAI_ADMIN_ALLOW_PROD=true      生产环境放行管理面（默认关闭，建议仅内网）
      SAI_CONFIG: /app/conf/config.yml
    volumes:
      - ./conf/config.yml:/app/conf/config.yml:ro
    # 资源上限（cpus/mem_limit 为 compose v2 立即生效写法，deploy 段供 swarm/新版 compose 使用）
    cpus: ${SAI_CPUS:-2.0}
    mem_limit: ${SAI_MEM_LIMIT:-2G}
    mem_reservation: ${SAI_MEM_RESERVATION:-512m}
    deploy:
      resources:
        limits:
          cpus: ${SAI_CPUS:-2.0}
          memory: ${SAI_MEM_LIMIT:-2G}
        reservations:
          memory: ${SAI_MEM_RESERVATION:-512m}
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
